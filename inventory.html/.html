    function formatDateTime(date) {
      if (!date) return "Unknown date";
      const d = date instanceof Date ? date : new Date(date);
      if (isNaN(d.getTime())) return "Invalid date";
      return d.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function evaluateItemHealth(item) {
      const now = new Date();
      let isExpired = false;
      let isExpiringSoon = false;
      let daysUntilExpiry = null;

      if (item.hasExpiry !== false && item.expiryDate) {
        const expDate = new Date(item.expiryDate);
        if (!isNaN(expDate.getTime())) {
          const diffTime = expDate.getTime() - now.getTime();
          daysUntilExpiry = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          if (daysUntilExpiry < 0) {
            isExpired = true;
          } else if (daysUntilExpiry <= 30) {
            isExpiringSoon = true;
          }
        }
      }

      const threshold = item.minStockThreshold || 10;
      const isBackorder = item.currentStock < 0;
      const isZero = item.currentStock === 0;
      const isLowStock = item.currentStock <= threshold && item.currentStock > 0;

      let state = "healthy";
      if (isExpired) state = "expired";
      else if (isBackorder || isZero) state = "critical";
      else if (isLowStock) state = "low";
      else if (isExpiringSoon) state = "expiring_soon";

      const denom = Math.max(item.initialStock || 1, item.currentStock || 1, threshold * 2);
      const capacityPercentage = Math.min(100, Math.max(0, Math.round((Math.max(0, item.currentStock) / denom) * 100)));

      return {
        state,
        isExpired,
        isExpiringSoon,
        isLowStock,
        isBackorder,
        isZero,
        daysUntilExpiry,
        capacityPercentage
      };
    }

    /* ─────────────────────────────────────────────────────────────
       Animated Number Counter
       ───────────────────────────────────────────────────────────── */
    function AnimatedNumber({ value, prefix = "", suffix = "" }) {
      const [displayVal, setDisplayVal] = useState(value);
      const prevValue = useRef(value);

      useEffect(() => {
        const start = prevValue.current;
        const end = value;
        if (start === end) return;

        const duration = 450;
        let startTime = null;
        let raf;

        const step = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          setDisplayVal(Math.round(start + (end - start) * eased));
          if (progress < 1) {
            raf = requestAnimationFrame(step);
          } else {
            setDisplayVal(end);
            prevValue.current = end;
          }
        };

        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [value]);

      return <span>{prefix}{displayVal.toLocaleString("en-IN")}{suffix}</span>;
    }

    /* ─────────────────────────────────────────────────────────────
       Highlighted Search Text
       ───────────────────────────────────────────────────────────── */
    function HighlightedText({ text, highlight }) {
      if (!highlight || !highlight.trim() || !text) return <>{text}</>;
      const escaped = highlight.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${escaped})`, "gi");
      const parts = String(text).split(regex);
      return (
        <>
          {parts.map((part, i) =>
            regex.test(part) ? (
              <mark key={i} className="bg-purple-200 text-purple-950 font-extrabold px-0.5 rounded">
                {part}
              </mark>
            ) : (
              <span key={i}>{part}</span>
            )
          )}
        </>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Inline Editable Cell (Excel Feel)
       ───────────────────────────────────────────────────────────── */
    function EditableCell({ value, onSave, type = "text", prefix = "", className = "" }) {
      const [isEditing, setIsEditing] = useState(false);
      const [val, setVal] = useState(value?.toString() || "");

      useEffect(() => {
        setVal(value?.toString() || "");
      }, [value]);

      const handleSave = () => {
        setIsEditing(false);
        if (val !== value?.toString()) onSave(val);
      };

      if (isEditing) {
        return (
          <input
            autoFocus
            type={type}
            value={val}
            onChange={(e) => setVal(e.target.value)}
            onBlur={handleSave}
            onKeyDown={(e) => {
              if (e.key === "Enter") handleSave();
              if (e.key === "Escape") {
                setVal(value?.toString() || "");
                setIsEditing(false);
              }
            }}
            className={`h-7 text-xs w-full min-w-[70px] px-2 py-1 border border-purple-500 bg-white rounded-md focus:outline-none focus:ring-2 focus:ring-purple-300 ${className}`}
          />
        );
      }

      const isEmpty = (value === undefined || value === null || value === "") && value !== 0;
      return (
        <div
          onClick={() => setIsEditing(true)}
          title="Click to inline edit"
          className={`cursor-pointer px-1.5 py-1 -mx-1.5 -my-1 rounded-md transition-all border border-transparent hover:border-purple-200 min-h-[24px] flex items-center ${
            isEmpty
              ? "border-dashed border-purple-100 text-slate-300 italic text-[11px] bg-purple-50/30 hover:bg-purple-50"
              : "hover:bg-purple-50/80"
          } ${className}`}
        >
          {isEmpty ? "Empty" : `${prefix}${value}`}
        </div>
      );
    }

              <rect x="0" y="5" width="22" height="36" rx="5" fill="url(#vialBody)" stroke="#c4b5fd" strokeWidth="1.5" />
              <rect x="3" y="18" width="16" height="20" rx="3" fill="#c084fc" opacity="0.75" />
            </g>
            <circle cx="48" cy="24" r="3" fill="#a855f7" opacity="0.6" />
            <circle cx="148" cy="24" r="2.5" fill="#e879f9" opacity="0.7" />
          </svg>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Premium Inventory Item Card (Dual Card View)
       ───────────────────────────────────────────────────────────── */
    function InventoryItemCard({ item, highlightSearch, recentlyUpdated, onRefill, onWastage, onEdit, onDelete }) {
      const health = evaluateItemHealth(item);
      const catIcon =
        item.category === "vaccinations" ? "syringe" :
        item.category === "blood_tests" ? "test-tube-2" :
        item.category === "consumables" ? "box" : "pill";

      const renderStatusBadge = () => {
        switch (health.state) {
          case "expired":
            return <span className="bg-red-600 text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shadow-sm">Expired</span>;
          case "critical":
            return (
              <span className="bg-red-100 text-red-700 border border-red-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-red-600 animate-ping" />
                {health.isBackorder ? `Backorder (${Math.abs(item.currentStock)})` : "Out of Stock"}
              </span>
            );
          case "low":
            return (
              <span className="bg-amber-100 text-amber-800 border border-amber-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" />
                Low Stock
              </span>
            );
          case "expiring_soon":
            return (
              <span className="bg-orange-100 text-orange-800 border border-orange-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                <Icon name="clock" className="w-3 h-3" />
                Exp in {health.daysUntilExpiry}d
              </span>
            );
          default:
            return (
              <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />
                In Stock
              </span>
            );
        }
      };

      const barColor =
        health.state === "expired" ? "from-slate-400 to-slate-500" :
        health.state === "critical" ? "from-red-500 to-rose-600" :
        health.state === "low" ? "from-amber-400 to-orange-500" :
        health.state === "expiring_soon" ? "from-orange-400 to-amber-500" :
        "from-emerald-400 via-teal-500 to-emerald-600";

      return (
        <div
          className={`group relative rounded-2xl bg-white border transition-all duration-300 flex flex-col justify-between p-4 shadow-sm hover:shadow-xl hover:shadow-purple-500/10 hover:-translate-y-1 ${
            health.isExpired ? "border-red-200 bg-slate-50/70 opacity-85" :
            health.state === "critical" ? "border-red-200 hover:border-red-300" :
            health.state === "low" ? "border-amber-200 hover:border-amber-300" :
            "border-purple-100 hover:border-purple-300"
          } ${recentlyUpdated ? "ring-2 ring-purple-500 bg-purple-50/50" : ""}`}
        >
          <div>
            {/* Top Status & Quick Action Bar */}
            <div className="flex items-center justify-between gap-2 mb-3">
              {renderStatusBadge()}
              <div className="flex items-center gap-0.5">
                <button
                  onClick={() => onWastage(item)}
                  title="Log Breakage / Wastage"
                  className="h-8 w-8 rounded-xl text-amber-500 hover:text-amber-700 hover:bg-amber-50 flex items-center justify-center transition-colors"
                >
                  <Icon name="alert-octagon" className="w-4 h-4" />
                </button>
                <button
                  onClick={() => onEdit(item)}
                  title="Edit Details"
                  className="h-8 w-8 rounded-xl text-slate-400 hover:text-purple-700 hover:bg-purple-50 flex items-center justify-center transition-colors"
                >
                  <Icon name="edit-2" className="w-3.5 h-3.5" />
                </button>
                <button
                  onClick={() => onDelete(item)}
                  title="Delete Asset"
                  className="h-8 w-8 rounded-xl text-slate-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition-colors"
                >
                  <Icon name="trash-2" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            {/* Product Visual + Identity */}
            <div className="flex items-start gap-3.5 mb-3.5">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-50 via-violet-50 to-fuchsia-50 border border-purple-100 flex items-center justify-center shrink-0 overflow-hidden shadow-inner group-hover:scale-105 transition-transform">
                {item.imageUrl ? (
                  <img src={item.imageUrl} alt={item.name} className="w-full h-full object-cover" />
                ) : (
                  <Icon name={catIcon} className="w-6 h-6 text-purple-600" />
                )}
              </div>
              <div className="min-w-0 flex-1">
                <h4 className="font-extrabold text-slate-900 text-sm leading-snug truncate" title={item.name}>
                  <HighlightedText text={item.name} highlight={highlightSearch} />
                </h4>
                <p className="text-xs font-medium text-slate-500 truncate mt-0.5">
                  {[
                    item.dosage,
                    item.specification,
                    item.subCategory || item.type,
                    item.usedForAge ? `Age: ${item.usedForAge}` : null
                  ].filter(Boolean).join(" • ") || "Clinical Supply"}
                </p>
                <div className="flex flex-wrap items-center gap-1 mt-1.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-purple-50 text-purple-700 border border-purple-100 capitalize">
                    {item.category.replace("_", " ")}
                  </span>
                  {item.isSterile && (
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-100">
                      Sterile
                    </span>
                  )}
                  {item.storageTemp && item.category === "vaccinations" && (
                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-blue-50 text-blue-700 border border-blue-100 truncate max-w-[130px]">
                      {item.storageTemp}
                    </span>
                  )}
                </div>
              </div>
            </div>

            {/* Stock Capacity Progress Bar */}
            <div className="bg-slate-50/90 rounded-xl p-2.5 border border-slate-100 mb-3">
              <div className="flex items-baseline justify-between mb-1.5">
                <div>
                  <span className={`text-lg font-black tracking-tight ${health.isBackorder || health.isZero ? "text-red-600" : health.isLowStock ? "text-amber-700" : "text-slate-900"}`}>
                    <AnimatedNumber value={Math.max(0, item.currentStock)} />
                  </span>
                  <span className="text-[11px] font-bold text-slate-500 ml-1">
                    {item.dispenseUnit ? `${item.dispenseUnit}s` : "units"}
                  </span>
                </div>
                <span className="text-[10px] font-bold text-slate-400">
                  {health.capacityPercentage}% capacity (Min: {item.minStockThreshold || 10})
                </span>
              </div>
              <div className="w-full h-2 bg-slate-200/80 rounded-full overflow-hidden">
                <div
                  className={`h-full rounded-full bg-gradient-to-r transition-all duration-700 ${barColor}`}
                  style={{ width: `${Math.max(6, health.capacityPercentage)}%` }}
                />
              </div>
            </div>

            {/* Metadata Grid */}
            <div className="grid grid-cols-2 gap-2 text-[11px] text-slate-600 mb-3.5 px-0.5">
              <div className="flex flex-col">
                <span className="text-[9px] uppercase font-bold text-slate-400">Unit Price</span>
                <span className="font-extrabold text-purple-950 text-xs">₹{item.price.toLocaleString("en-IN")}</span>
              </div>
              <div className="flex flex-col">
                <span className="text-[9px] uppercase font-bold text-slate-400">Dispensed</span>
                <span className="font-bold text-slate-700">{item.dispensed} units</span>
              </div>
              {item.supplier && (
                <div className="flex items-center gap-1.5 col-span-2 truncate text-slate-500">
                  <Icon name="building-2" className="w-3 h-3 text-purple-400" />
                  <span className="truncate">Supplier: <strong className="text-slate-700">{item.supplier}</strong></span>
                </div>
              )}
              {item.location && (
                <div className="flex items-center gap-1.5 col-span-2 truncate text-slate-500">
                  <Icon name="map-pin" className="w-3 h-3 text-purple-400" />
                  <span className="truncate">{item.location}</span>
                </div>
              )}
              {item.hasExpiry !== false && (item.expiryDate || item.batchNumber) && (
                <div className="flex items-center justify-between col-span-2 pt-1.5 border-t border-slate-100 text-[10px]">
                  {item.batchNumber ? <span className="font-mono font-bold text-slate-600">Batch: {item.batchNumber}</span> : <span />}
                  {item.expiryDate && (
                    <span className={`font-bold px-1.5 py-0.5 rounded ${health.isExpired ? "bg-red-600 text-white" : health.isExpiringSoon ? "bg-orange-100 text-orange-800" : "bg-slate-100 text-slate-600"}`}>
                      Exp: {item.expiryDate}
                    </span>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Card Footer Actions */}
          <div className="flex items-center gap-2 pt-2 border-t border-purple-50">
            {!health.isExpired ? (
              <button
                onClick={() => onRefill(item)}
                className="h-9 flex-1 rounded-xl bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-700 hover:to-violet-700 text-white font-bold text-xs shadow-sm shadow-purple-200 flex items-center justify-center gap-1.5 transition-all active:scale-95"
              >
                <Icon name="refresh-cw" className="w-3.5 h-3.5" /> Refill
              </button>
            ) : (
              <div className="flex-1 text-center py-2 rounded-xl bg-red-50 text-red-700 font-bold text-xs border border-red-200">
                Expired — Dispose
              </div>
            )}
            <button
              onClick={() => onEdit(item)}
              className="h-9 px-3.5 rounded-xl border border-purple-200 text-purple-700 hover:bg-purple-50 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors"
            >
              <Icon name="edit-2" className="w-3.5 h-3.5" /> Edit
            </button>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Main Panacea Inventory Application
       ───────────────────────────────────────────────────────────── */
    function PanaceaInventoryApp() {
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [logs, setLogs] = useState(INITIAL_LOGS);
      const [activeTab, setActiveTab] = useState("medications");
      const [subTab, setSubTab] = useState("list"); // 'list' | 'stats'
      const [viewMode, setViewMode] = useState("card"); // 'card' | 'table'

      // Explorer Filters & Sorting
      const [localSearch, setLocalSearch] = useState("");
      const [showDropdown, setShowDropdown] = useState(false);
      const [statusFilter, setStatusFilter] = useState("all");
      const [supplierFilter, setSupplierFilter] = useState("all");
      const [sortBy, setSortBy] = useState("name_asc");
      const [recentlyUpdatedId, setRecentlyUpdatedId] = useState(null);

      // Modals State
      const [addModalOpen, setAddModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [refillItem, setRefillItem] = useState(null);
      const [wastageItem, setWastageItem] = useState(null);
      const [deleteConfirmItem, setDeleteConfirmItem] = useState(null);
      const [wipeConfirmOpen, setWipeConfirmOpen] = useState(false);
      const [downloadOpen, setDownloadOpen] = useState(false);
      const [reportRange, setReportRange] = useState("1month");

      // Toast Notification State
      const [toasts, setToasts] = useState([]);
      const fileInputRef = useRef(null);

      const showToast = (title, description, variant = "default") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, title, description, variant }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3600);
      };

      const triggerHighlight = (id) => {
        setRecentlyUpdatedId(id);
        setTimeout(() => {
          setRecentlyUpdatedId((prev) => (prev === id ? null : prev));
        }, 2200);
      };

      // Items for current category tab
      const tabItems = useMemo(() => {
        if (activeTab === "log") return items;
        return items.filter((i) => i.category === activeTab);
      }, [items, activeTab]);

      // Derived Intelligence Metrics for active category
      const inventoryMetrics = useMemo(() => {
        let totalValue = 0;
        let totalUnits = 0;
        let lowStockCount = 0;
        let criticalCount = 0;
        let expiringSoonCount = 0;
        let expiredCount = 0;
        let healthyCount = 0;

        tabItems.forEach((item) => {
          const avail = Math.max(0, item.currentStock);
          totalUnits += avail;
          totalValue += avail * (item.price || 0);

          const h = evaluateItemHealth(item);
          if (h.isExpired) expiredCount++;
          else if (h.isExpiringSoon) expiringSoonCount++;

          if (h.isBackorder || h.isZero) criticalCount++;
          else if (h.isLowStock) lowStockCount++;

          if (h.state === "healthy") healthyCount++;
        });

        const total = tabItems.length || 1;
        return {
          totalItems: tabItems.length,
          totalValue,
          totalUnits,
          lowAndCriticalCount: lowStockCount + criticalCount,
          lowStockCount,
          criticalCount,
          expiringAttentionCount: expiringSoonCount + expiredCount,
          expiringSoonCount,
          expiredCount,
          healthyCount,
          healthyPct: tabItems.length > 0 ? Math.round((healthyCount / total) * 100) : 100,
          lowPct: tabItems.length > 0 ? Math.round(((lowStockCount + criticalCount) / total) * 100) : 0,
          expPct: tabItems.length > 0 ? Math.round(((expiringSoonCount + expiredCount) / total) * 100) : 0
        };
      }, [tabItems]);

      const availableSuppliers = useMemo(() => {
        const set = new Set();
        tabItems.forEach((i) => {
          if (i.supplier && i.supplier.trim()) set.add(i.supplier.trim());
        });
        return Array.from(set).sort();
      }, [tabItems]);

      // Filtered & Sorted Items
      const categoryItems = useMemo(() => {
        const term = localSearch.trim().toLowerCase();
        const filtered = tabItems.filter((d) => {
          const matchesSearch =
            !term ||
            d.name.toLowerCase().includes(term) ||
            (d.supplier && d.supplier.toLowerCase().includes(term)) ||
            (d.batchNumber && d.batchNumber.toLowerCase().includes(term)) ||
            (d.location && d.location.toLowerCase().includes(term)) ||
            (d.subCategory && d.subCategory.toLowerCase().includes(term));

          if (!matchesSearch) return false;
          if (supplierFilter !== "all" && (d.supplier || "") !== supplierFilter) return false;

          if (statusFilter !== "all") {
            const h = evaluateItemHealth(d);
            if (statusFilter === "low" && !(h.isLowStock || h.isBackorder || h.isZero)) return false;
            if (statusFilter === "expiring" && !(h.isExpiringSoon || h.isExpired)) return false;
            if (statusFilter === "expired" && !h.isExpired) return false;
            if (statusFilter === "healthy" && h.state !== "healthy") return false;
          }
          return true;
        });

        return filtered.sort((a, b) => {
          if (sortBy === "stock_asc") return a.currentStock - b.currentStock;
          if (sortBy === "stock_desc") return b.currentStock - a.currentStock;
          if (sortBy === "price_desc") return (b.price || 0) - (a.price || 0);
          if (sortBy === "dispensed_desc") return (b.dispensed || 0) - (a.dispensed || 0);
          return a.name.localeCompare(b.name);
        });
      }, [tabItems, localSearch, supplierFilter, statusFilter, sortBy]);

      const dynamicColumns = useMemo(
        () => Array.from(new Set(tabItems.flatMap((i) => Object.keys(i.customFields || {})))),
        [tabItems]
      );

      const topUsed = useMemo(
        () => [...tabItems].sort((a, b) => b.dispensed - a.dispensed).slice(0, 10).filter((i) => i.dispensed > 0),
        [tabItems]
      );
      const maxDispensed = topUsed.length > 0 ? topUsed[0].dispensed : 1;

      const filteredLogs = useMemo(() => {
        if (!localSearch.trim()) return logs;
        const term = localSearch.toLowerCase();
        return logs.filter(
          (log) =>
            log.itemName.toLowerCase().includes(term) ||
            (log.patientName && log.patientName.toLowerCase().includes(term)) ||
            (log.notes && log.notes.toLowerCase().includes(term))
        );
      }, [logs, localSearch]);

      // Inline Edit Handlers
      const handleInlineSave = (item, field, val) => {
        let updateVal = val;
        if (field === "price") updateVal = Math.max(0, parseFloat(val) || 0);
        if (field === "minStockThreshold") updateVal = parseInt(val, 10) || 10;

        setItems((prev) =>
          prev.map((it) => (it.id === item.id ? { ...it, [field]: updateVal } : it))
        );
        triggerHighlight(item.id);
        showToast("Field Updated", `Updated ${field} for ${item.name}.`);
      };

      const handleInlineCustomFieldSave = (item, col, val) => {
        setItems((prev) =>
          prev.map((it) =>
            it.id === item.id
              ? { ...it, customFields: { ...(it.customFields || {}), [col]: val } }
              : it
          )
        );
        triggerHighlight(item.id);
        showToast("Custom Attribute Saved", `Updated "${col}" on ${item.name}.`);
      };

      const handleDeleteColumn = (colName) => {
        if (!window.confirm(`Delete custom column "${colName}" from all items in this category?`)) return;
        setItems((prev) =>
          prev.map((it) => {
            if (it.category !== activeTab || !it.customFields) return it;
            const copy = { ...it.customFields };
            delete copy[colName];
            return { ...it, customFields: copy };
          })
        );
        showToast("Column Deleted", `Removed "${colName}" from ${activeTab}.`);
      };

      // Excel / CSV Smart Import
      const handleUniversalDataUpload = async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        const file = e.target.files[0];
        try {
          const data = await file.arrayBuffer();
          const workbook = window.XLSX.read(data, { type: "array" });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const parsedData = window.XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (parsedData.length === 0) throw new Error("Spreadsheet is empty.");

          const newItems = [];
          const newLogs = [];

          parsedData.forEach((row, idx) => {
            const itemId = `imp-${Date.now()}-${idx}`;
            const customFields = {};
            const normalizedObj = {
              id: itemId,
              category: activeTab === "log" ? "medications" : activeTab,
              dispensed: 0,
              price: 0,
              initialStock: 25,
              minStockThreshold: 10,
              hasExpiry: true
            };

            Object.entries(row).forEach(([key, val]) => {
              const cleanKey = key.trim().toLowerCase();
              const cleanVal = typeof val === "string" ? val.trim() : val;
              if (cleanVal === "") return;

              if (["name", "item", "product", "title"].some((h) => cleanKey === h || cleanKey.includes("name")))
                normalizedObj.name = String(cleanVal);
              else if (["dosage", "dose", "strength"].some((h) => cleanKey.includes(h)))
                normalizedObj.dosage = String(cleanVal);
              else if (cleanKey === "type") normalizedObj.type = String(cleanVal);
              else if (["price", "cost", "mrp", "rate"].some((h) => cleanKey.includes(h)))
                normalizedObj.price = Math.max(0, parseFloat(String(cleanVal)) || 0);
              else if (["stock", "qty", "quantity", "initial"].some((h) => cleanKey.includes(h)))
                normalizedObj.initialStock = parseInt(String(cleanVal), 10) || 0;
              else if (["batch", "lot"].some((h) => cleanKey.includes(h)))
                normalizedObj.batchNumber = String(cleanVal);
              else if (["exp", "expiry"].some((h) => cleanKey.includes(h)))
                normalizedObj.expiryDate = String(cleanVal);
              else if (cleanKey.includes("supplier") || cleanKey.includes("vendor"))
                normalizedObj.supplier = String(cleanVal);
              else if (cleanKey.includes("location"))
                normalizedObj.location = String(cleanVal);
              else customFields[key.trim()] = String(cleanVal);
            });

            if (!normalizedObj.name) normalizedObj.name = `Imported Asset #${idx + 1}`;
            normalizedObj.currentStock = normalizedObj.initialStock;
            normalizedObj.customFields = customFields;

            newItems.push(normalizedObj);
            newLogs.push({
              id: `log-imp-${Date.now()}-${idx}`,
              itemId,
              itemName: normalizedObj.name,
              actionType: "refill",
              quantity: normalizedObj.initialStock,
              date: new Date(),
              notes: "Excel Smart Bulk Import"
            });
          });

          setItems((prev) => [...newItems, ...prev]);
          setLogs((prev) => [...newLogs, ...prev]);
          showToast("Smart Import Complete", `Imported ${newItems.length} records with dynamic custom columns.`);
          e.target.value = "";
        } catch (err) {
          showToast("Import Failed", err.message || "Could not parse spreadsheet.", "destructive");
        }
      };

      // Export PDF Report
      const handleDownloadPdf = () => {
        try {
          const { jsPDF } = window.jspdf;
          const docPdf = new jsPDF("p", "mm", "a4");
          const pdfWidth = docPdf.internal.pageSize.getWidth();

          docPdf.setFillColor(124, 58, 237);
          docPdf.rect(0, 0, pdfWidth, 34, "F");
          docPdf.setTextColor(255, 255, 255);
          docPdf.setFontSize(20);
          docPdf.setFont("helvetica", "bold");
          docPdf.text("PANACEA CLINIC INVENTORY REPORT", pdfWidth / 2, 21, { align: "center" });

          docPdf.setTextColor(30, 27, 75);
          docPdf.setFontSize(10);
          docPdf.setFont("helvetica", "normal");
          docPdf.text(`Generated On: ${formatDateTime(new Date())}`, 15, 44);
          docPdf.text(`Period: ${reportRange.toUpperCase()}`, pdfWidth - 15, 44, { align: "right" });

          docPdf.autoTable({
            startY: 52,
            head: [["Item Name", "Category", "Supplier", "Price (Rs.)", "Initial", "Dispensed", "Current Stock"]],
            body: items.map((item) => [
              item.name,
              item.category.toUpperCase(),
              item.supplier || "-",
              `Rs. ${item.price}`,
              item.initialStock,
              item.dispensed,
              item.currentStock
            ]),
            theme: "grid",
            headStyles: { fillColor: [139, 92, 246], textColor: 255 },
            styles: { fontSize: 8.5, cellPadding: 2.8 }
          });

          const nextY = docPdf.lastAutoTable.finalY + 12;
          docPdf.setFontSize(13);
          docPdf.setFont("helvetica", "bold");
          docPdf.setTextColor(109, 40, 217);
          docPdf.text("Recent Inventory Audit Logs", 15, nextY);

          docPdf.autoTable({
            startY: nextY + 5,
            head: [["Date", "Action", "Item", "Patient / Notes", "Delta"]],
            body: logs.map((l) => [
              formatDateTime(l.date),
              l.actionType.toUpperCase(),
              l.itemName,
              `${l.patientName ? l.patientName + " - " : ""}${l.notes || ""}`,
              `${l.actionType === "refill" ? "+" : "-"}${l.quantity}`
            ]),
            theme: "striped",
            headStyles: { fillColor: [167, 139, 250], textColor: 255 },
            styles: { fontSize: 8 }
          });

          docPdf.save(`Panacea_Inventory_Report_${new Date().toISOString().slice(0, 10)}.pdf`);
          setDownloadOpen(false);

          {/* 1. Refill Modal */}
          {refillItem && (
            <RefillModal
              item={refillItem}
              onClose={() => setRefillItem(null)}
              onConfirm={(qty, batch, exp) => {
                setItems((prev) =>
                  prev.map((it) =>
                    it.id === refillItem.id
                      ? {
                          ...it,
                          initialStock: it.initialStock + qty,
                          currentStock: it.currentStock + qty,
                          batchNumber: batch || it.batchNumber,
                          expiryDate: exp || it.expiryDate
                        }
                      : it
                  )
                );
                setLogs((prev) => [
                  {
                    id: `log-${Date.now()}`,
                    itemId: refillItem.id,
                    itemName: refillItem.name,
                    actionType: "refill",
                    quantity: qty,
                    date: new Date(),
                    notes: `Restock${batch ? " Batch: " + batch : ""}`
                  },
                  ...prev
                ]);
                triggerHighlight(refillItem.id);
                showToast("Stock Refilled", `Added +${qty} units to ${refillItem.name}.`);
                setRefillItem(null);
              }}
            />
          )}

          {/* 2. Wastage Modal */}
          {wastageItem && (
            <WastageModal
              item={wastageItem}
              onClose={() => setWastageItem(null)}
              onConfirm={(qty, reason) => {
                setItems((prev) =>
                  prev.map((it) =>
                    it.id === wastageItem.id
                      ? {
                          ...it,
                          dispensed: it.dispensed + qty,
                          currentStock: it.currentStock - qty
                        }
                      : it
                  )
                );
                setLogs((prev) => [
                  {
                    id: `log-${Date.now()}`,
                    itemId: wastageItem.id,
                    itemName: wastageItem.name,
                    actionType: "wastage",
                    quantity: qty,
                    date: new Date(),
                    notes: `Wastage: ${reason || "Disposed"}`
                  },
                  ...prev
                ]);
                triggerHighlight(wastageItem.id);
                showToast("Wastage Logged", `Deducted ${qty} units from ${wastageItem.name}.`);
                setWastageItem(null);
              }}
            />
          )}

          {/* 3. Add / Edit Asset Modal */}
          {addModalOpen && (
            <AddEditModal
              currentTab={activeTab === "log" ? "medications" : activeTab}
              editingItem={editingItem}
              dynamicCols={dynamicColumns}
              onClose={() => {
                setAddModalOpen(false);
                setEditingItem(null);
              }}
              onSave={(savedItem, isEdit) => {
                if (isEdit) {
                  setItems((prev) => prev.map((it) => (it.id === savedItem.id ? savedItem : it)));
                  showToast("Asset Updated", `${savedItem.name} updated successfully.`);
                } else {
                  setItems((prev) => [savedItem, ...prev]);
                  setLogs((prev) => [
                    {
                      id: `log-${Date.now()}`,
                      itemId: savedItem.id,
                      itemName: savedItem.name,
                      actionType: "refill",
                      quantity: savedItem.initialStock,
                      date: new Date(),
                      notes: "Initial Stock Setup"
                    },
                    ...prev
                  ]);
                  showToast("Asset Added", `${savedItem.name} added to clinic inventory.`);
                }
                triggerHighlight(savedItem.id);
                setAddModalOpen(false);
                setEditingItem(null);
              }}
            />
          )}

          {/* 4. Delete Single Item Confirmation */}
          {deleteConfirmItem && (
            <div className="fixed inset-0 z-50 bg-purple-950/30 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-red-100 shadow-2xl max-w-sm w-full p-6 text-center">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="alert-triangle" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-extrabold text-red-600">Delete {deleteConfirmItem.name}?</h3>
                <p className="text-xs text-slate-500 mt-1">This will permanently remove this item from your inventory.</p>
                <div className="flex justify-center gap-2.5 mt-5">
                  <button onClick={() => setDeleteConfirmItem(null)} className="px-5 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setItems((prev) => prev.filter((i) => i.id !== deleteConfirmItem.id));
                      showToast("Item Deleted", `${deleteConfirmItem.name} removed.`);
                      setDeleteConfirmItem(null);
                    }}
                    className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md"
                  >
                    Delete Item
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. Wipe Category Confirmation */}
          {wipeConfirmOpen && (
            <div className="fixed inset-0 z-50 bg-purple-950/30 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-red-100 shadow-2xl max-w-sm w-full p-6 text-center">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="alert-triangle" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-extrabold text-red-600">Wipe All {categoryLabel}?</h3>
                <p className="text-xs text-slate-500 mt-1">
                  This will permanently delete <strong>ALL {tabItems.length} items</strong> in this category.
                </p>
                <div className="flex justify-center gap-2.5 mt-5">
                  <button onClick={() => setWipeConfirmOpen(false)} className="px-5 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setItems((prev) => prev.filter((i) => i.category !== activeTab));
                      showToast("Category Wiped", `All ${categoryLabel} items were deleted.`);
                      setWipeConfirmOpen(false);
                    }}
                    className="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md"
                  >
                    Yes, Wipe Data
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. Download PDF Report Modal */}
          {downloadOpen && (
            <div className="fixed inset-0 z-50 bg-purple-950/30 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-purple-100 shadow-2xl max-w-md w-full p-6">
                <div className="flex items-center gap-3 pb-3 border-b border-purple-50">
                  <div className="w-10 h-10 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center">
                    <Icon name="download" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-extrabold text-purple-950">Export Clinic Inventory Report</h3>
                    <p className="text-xs text-slate-500">Generate a formatted PDF audit of stock levels & logs.</p>
                  </div>
                </div>
                <div className="py-4 space-y-2">
                  <label className="text-[10px] font-bold uppercase tracking-wider text-purple-700">Audit Timeframe</label>
                  <select
                    value={reportRange}
                    onChange={(e) => setReportRange(e.target.value)}
                    className="w-full h-11 px-3 rounded-xl border border-purple-100 bg-slate-50 text-xs font-bold text-slate-700"
                  >
                    <option value="1month">Last 1 Month</option>
                    <option value="6months">Last 6 Months</option>
                    <option value="1year">Last 1 Year</option>
                    <option value="all">All Time</option>
                  </select>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-purple-50">
                  <button onClick={() => setDownloadOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50">
                    Cancel
                  </button>
                  <button
                    onClick={handleDownloadPdf}
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-violet-600 text-white text-xs font-bold shadow-md flex items-center gap-1.5"
                  >
                    <Icon name="download" className="w-4 h-4" /> Export PDF Report
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Stack */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map((t) => (
              <div
                key={t.id}
                className={`pointer-events-auto p-4 rounded-2xl shadow-xl border backdrop-blur-xl flex items-start gap-3 transition-all ${
                  t.variant === "destructive"
                    ? "bg-red-600 text-white border-red-500"
                    : "bg-white/95 text-purple-950 border-purple-200"
                }`}
              >
                <Icon name={t.variant === "destructive" ? "alert-triangle" : "check-circle-2"} className={`w-5 h-5 shrink-0 mt-0.5 ${t.variant === "destructive" ? "text-white" : "text-purple-600"}`} />
                <div>
                  <h5 className="text-xs font-extrabold">{t.title}</h5>
                  <p className={`text-[11px] mt-0.5 ${t.variant === "destructive" ? "text-red-100" : "text-slate-500"}`}>{t.description}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Refill Stock Modal Component
       ───────────────────────────────────────────────────────────── */
    function RefillModal({ item, onClose, onConfirm }) {
      const [qty, setQty] = useState("");
      const [batch, setBatch] = useState(item.batchNumber || "");
      const [exp, setExp] = useState(item.expiryDate || "");
      const parsed = parseInt(qty, 10) || 0;

      return (
        <div className="fixed inset-0 z-50 bg-purple-950/30 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl border border-purple-100 shadow-2xl max-w-md w-full p-6">
            <div className="flex items-center justify-between pb-3 border-b border-purple-50">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center">
                  <Icon name="refresh-cw" className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-purple-950">Refill Stock: {item.name}</h3>
                  <p className="text-[11px] text-slate-500">Add incoming units and update batch records.</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
            </div>

            <div className="py-4 space-y-4">
              <div className="grid grid-cols-2 gap-2.5">
                <div className="p-3 rounded-2xl bg-purple-50/60 border border-purple-100">
                  <span className="text-[10px] font-bold uppercase text-slate-500">Current Stock</span>
                  <div className="text-2xl font-black text-purple-950 mt-0.5">{item.currentStock}</div>
                </div>
                <div className="p-3 rounded-2xl bg-emerald-50/70 border border-emerald-200">
                  <span className="text-[10px] font-bold uppercase text-emerald-700">Projected Total</span>
                  <div className="text-2xl font-black text-emerald-800 mt-0.5">
                    {item.currentStock + parsed}
                    {parsed > 0 && <span className="text-xs ml-1.5 bg-emerald-200/80 px-1.5 py-0.5 rounded">+{parsed}</span>}
                  </div>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="flex justify-between items-center">
                  <label className="text-[10px] font-bold uppercase tracking-wider text-purple-700">Quantity to Add</label>
                  <div className="flex gap-1">
                    {[10, 50, 100].map((p) => (
                      <button
                        key={p}
                        type="button"
                        onClick={() => setQty(String((parseInt(qty, 10) || 0) + p))}
                        className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-700 hover:bg-purple-200"
                      >
                        +{p}
                      </button>
                    ))}
                  </div>
                </div>
                <input
                  type="number"
                  min="1"
                  autoFocus
                  value={qty}
                  onChange={(e) => setQty(e.target.value)}
                  placeholder="e.g. 100"
                  className="w-full h-11 text-center text-lg font-black rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-500"
                />
              </div>

              {item.hasExpiry !== false && (
                <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-purple-50">
                  <div>
                    <label className="text-[10px] font-bold uppercase text-purple-700">Batch No.</label>
                    <input value={batch} onChange={(e) => setBatch(e.target.value)} className="w-full h-9 px-2.5 mt-1 text-xs rounded-xl border border-purple-100" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold uppercase text-red-600">Expiry Date</label>
                    <input type="date" value={exp} onChange={(e) => setExp(e.target.value)} className="w-full h-9 px-2.5 mt-1 text-xs rounded-xl border border-red-200" />
                  </div>
                </div>
              )}
            </div>

            <div className="flex justify-end gap-2 pt-3 border-t border-purple-50">
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50">Cancel</button>
              <button
                disabled={parsed <= 0}
                onClick={() => onConfirm(parsed, batch, exp)}
                className="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-violet-600 text-white text-xs font-bold shadow-md disabled:opacity-40"
              >
                Confirm Refill
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Wastage Modal Component
       ───────────────────────────────────────────────────────────── */
    function WastageModal({ item, onClose, onConfirm }) {
      const [qty, setQty] = useState("");
      const [reason, setReason] = useState("");
      const parsed = parseInt(qty, 10) || 0;

      return (
        <div className="fixed inset-0 z-50 bg-purple-950/30 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl border border-orange-100 shadow-2xl max-w-md w-full p-6">
            <div className="flex items-center justify-between pb-3 border-b border-orange-50">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center">
                  <Icon name="alert-octagon" className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-orange-950">Log Wastage: {item.name}</h3>
                  <p className="text-[11px] text-slate-500">Record broken vials, spilled meds, or expired disposal.</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
            </div>

            <div className="py-4 space-y-3.5">
              <div>
                <label className="text-[10px] font-bold uppercase text-orange-700">Quantity Lost / Disposed</label>
                <input
                  type="number"
                  min="1"
                  autoFocus
                  value={qty}
                  onChange={(e) => setQty(e.target.value)}
                  placeholder={`Available: ${Math.max(0, item.currentStock)}`}
                  className="w-full h-11 px-3 mt-1 text-base font-bold rounded-xl border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>
              <div>
                <label className="text-[10px] font-bold uppercase text-orange-700">Reason / Disposal Note</label>
                <input
                  value={reason}
                  onChange={(e) => setReason(e.target.value)}
                  placeholder="e.g. Dropped vial, cold-chain breach, expired..."
                  className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-3 border-t border-orange-50">
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50">Cancel</button>
              <button
                disabled={parsed <= 0}
                onClick={() => onConfirm(parsed, reason)}
                className="px-5 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold shadow-md disabled:opacity-40"
              >
                Confirm Wastage
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       Add / Edit Item Modal Component (2-Step Core + Custom Columns)
       ───────────────────────────────────────────────────────────── */
    function AddEditModal({ currentTab, editingItem, dynamicCols, onClose, onSave }) {
      const [formPage, setFormPage] = useState(1);
      const [name, setName] = useState(editingItem?.name || "");
      const [dosage, setDosage] = useState(editingItem?.dosage || "");
      const [type, setType] = useState(editingItem?.type || "Tablet");
      const [price, setPrice] = useState(editingItem?.price?.toString() || "");
      const [initialStock, setInitialStock] = useState(editingItem?.initialStock?.toString() || "100");
      const [minStockThreshold, setMinStockThreshold] = useState(editingItem?.minStockThreshold?.toString() || "15");
      const [usedForAge, setUsedForAge] = useState(editingItem?.usedForAge || "");
      const [supplier, setSupplier] = useState(editingItem?.supplier || "");
      const [location, setLocation] = useState(editingItem?.location || "");
      const [batchNumber, setBatchNumber] = useState(editingItem?.batchNumber || "");
      const [expiryDate, setExpiryDate] = useState(editingItem?.expiryDate || "");
      const [description, setDescription] = useState(editingItem?.description || "");
      const [subCategory, setSubCategory] = useState(editingItem?.subCategory || "Single-Dose Vial (SDV)");
      const [storageTemp, setStorageTemp] = useState(editingItem?.storageTemp || "Refrigerated 2°C to 8°C");
      const [specification, setSpecification] = useState(editingItem?.specification || "");

      const [customFieldsArray, setCustomFieldsArray] = useState(() => {
        const seeded = dynamicCols.map((c) => ({ key: c, value: editingItem?.customFields?.[c] || "" }));
        return seeded.length > 0 ? seeded : [{ key: "", value: "" }];
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const customFields = {};
        customFieldsArray.forEach((f) => {
          if (f.key.trim() && f.value.trim()) customFields[f.key.trim()] = f.value.trim();
        });

        const initQty = parseInt(initialStock, 10) || 0;
        const dispensedQty = editingItem ? editingItem.dispensed : 0;

        const payload = {
          id: editingItem ? editingItem.id : `item-${Date.now()}`,
          name: name.trim(),
          dosage: dosage.trim(),
          type,
          category: editingItem ? editingItem.category : currentTab,
          price: Math.max(0, parseFloat(price) || 0),
          initialStock: initQty,
          dispensed: dispensedQty,
          currentStock: initQty - dispensedQty,
          minStockThreshold: parseInt(minStockThreshold, 10) || 10,
          usedForAge: usedForAge.trim(),
          supplier: supplier.trim(),
          location: location.trim(),
          batchNumber: batchNumber.trim(),
          expiryDate,
          hasExpiry: true,
          description: description.trim(),
          subCategory,
          storageTemp,
          specification,
          customFields
        };

        onSave(payload, !!editingItem);
      };

      return (
        <div className="fixed inset-0 z-50 bg-purple-950/35 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl border border-purple-100 shadow-2xl max-w-2xl w-full overflow-hidden">
            <div className="px-6 py-4 border-b border-purple-100 bg-gradient-to-r from-purple-50 via-violet-50/60 to-fuchsia-50/40 flex justify-between items-center">
              <div>
                <h3 className="text-lg font-extrabold text-purple-950">
                  {editingItem ? `Edit ${editingItem.name}` : `Add New ${currentTab.replace("_", " ")} Asset`}
                </h3>
                <p className="text-[11px] text-purple-700/70">Configure clinical details, threshold alerts, and custom columns.</p>
              </div>
              <div className="flex items-center gap-2">
                <div className="flex bg-white rounded-xl p-1 border border-purple-100">
                  <button type="button" onClick={() => setFormPage(1)} className={`px-3 py-1 rounded-lg text-xs font-bold ${formPage === 1 ? "bg-purple-600 text-white" : "text-slate-600"}`}>1. Core</button>
                  <button type="button" onClick={() => setFormPage(2)} className={`px-3 py-1 rounded-lg text-xs font-bold ${formPage === 2 ? "bg-purple-600 text-white" : "text-slate-600"}`}>2. Custom</button>
                </div>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 ml-2"><Icon name="x" className="w-5 h-5" /></button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[78vh] overflow-y-auto">
              {formPage === 1 ? (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="text-[10px] font-bold uppercase text-purple-700">Item / Asset Name *</label>
                      <input required value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Dolo 650, MMR Vaccine" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70 focus:bg-white" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Dosage / Strength</label>
                      <input value={dosage} onChange={(e) => setDosage(e.target.value)} placeholder="e.g. 650mg, 0.5ml" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70 focus:bg-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Initial Stock Qty *</label>
                      <input type="number" required value={initialStock} onChange={(e) => setInitialStock(e.target.value)} className="w-full h-10 px-3 mt-1 text-xs font-bold rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Unit Price (₹)</label>
                      <input type="number" step="0.01" value={price} onChange={(e) => setPrice(e.target.value)} placeholder="0.00" className="w-full h-10 px-3 mt-1 text-xs font-bold rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Low Stock Alert Threshold</label>
                      <input type="number" value={minStockThreshold} onChange={(e) => setMinStockThreshold(e.target.value)} className="w-full h-10 px-3 mt-1 text-xs font-bold rounded-xl border border-purple-200 bg-purple-50/40" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Supplier / Brand</label>
                      <input value={supplier} onChange={(e) => setSupplier(e.target.value)} placeholder="e.g. Cipla, GSK" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Batch / Lot Number</label>
                      <input value={batchNumber} onChange={(e) => setBatchNumber(e.target.value)} placeholder="e.g. BT-2026" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-red-600">Expiry Date</label>
                      <input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-red-200 bg-red-50/30" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Physical Location</label>
                      <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Main Fridge A, Shelf 2" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-purple-700">Target Patient Age / Notes</label>
                      <input value={usedForAge} onChange={(e) => setUsedForAge(e.target.value)} placeholder="e.g. Adults, Pediatrics" className="w-full h-10 px-3 mt-1 text-xs rounded-xl border border-purple-100 bg-slate-50/70" />
                    </div>
                  </div>
                </div>
              ) : (
                <div className="bg-purple-50/60 border border-purple-100 rounded-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h4 className="text-xs font-extrabold uppercase text-purple-900">Dynamic Custom Attributes</h4>
                      <p className="text-[11px] text-purple-700/70">Automatically creates inline-editable columns in Table View.</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setCustomFieldsArray([...customFieldsArray, { key: "", value: "" }])}
                      className="px-3 py-1.5 rounded-xl bg-white border border-purple-200 text-purple-700 text-xs font-bold"
                    >
                      + Add Attribute
                    </button>
                  </div>
                  <div className="space-y-2">
                    {customFieldsArray.map((f, idx) => (
                      <div key={idx} className="flex gap-2 bg-white p-2 rounded-xl border border-purple-100">
                        <input
                          placeholder="Column Header (e.g. Rack Code)"
                          value={f.key}
                          onChange={(e) => {
                            const copy = [...customFieldsArray];
                            copy[idx].key = e.target.value;
                            setCustomFieldsArray(copy);
                          }}
                          className="h-8 px-2.5 text-xs font-bold bg-purple-50/40 rounded-lg w-2/5 border border-purple-100"
                        />
                        <input
                          placeholder="Value (e.g. R-104)"
                          value={f.value}
                          onChange={(e) => {
                            const copy = [...customFieldsArray];
                            copy[idx].value = e.target.value;
                            setCustomFieldsArray(copy);
                          }}
                          className="h-8 px-2.5 text-xs bg-slate-50 rounded-lg flex-1 border border-slate-100"
                        />
                        <button
                          type="button"
                          onClick={() => setCustomFieldsArray(customFieldsArray.filter((_, i) => i !== idx))}
                          className="h-8 w-8 text-red-400 hover:text-red-600 flex items-center justify-center"
                        >
                          <Icon name="x" className="w-4 h-4" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex justify-between items-center pt-4 border-t border-purple-100">
                <button
                  type="button"
                  onClick={() => setFormPage(formPage === 1 ? 2 : 1)}
                  className="px-4 py-2 rounded-xl border border-purple-200 text-purple-700 text-xs font-bold hover:bg-purple-50"
                >
                  {formPage === 1 ? "Custom Columns →" : "← Back to Core"}
                </button>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50">
                    Cancel
                  </button>
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-violet-600 text-white text-xs font-bold shadow-md">
                    {editingItem ? "Update Asset" : "Save to Inventory"}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PanaceaInventoryApp />);
  </script>
</body>
</html>
